<div class="pill-wrapper" [class.loading]="loading()" [class.bus-pill]="data().type === 'bus'"
    [class.inactive]="inactive() || (!loading() && (data().valueState === 'missing' || data().valueState === 'empty'))"
    [class.urgent]="isUrgent()">
    <p>{{data() | displayInformationPill: timeService.currentTime()}}</p>
</div>>
